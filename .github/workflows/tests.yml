name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Unit tests (core, translations)
        run: node --test "test/*.test.mjs"
      - name: Syntax check of all scripts
        run: |
          for f in js/*.js sw.js serve.mjs; do node --check "$f"; done
