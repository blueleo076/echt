name: Bug report / Fehlerbericht
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you! Please do **not** post secrets, invitation codes, backup files or passwords here. For security problems use the private reporting link above.
  - type: textarea
    id: what
    attributes:
      label: What happened? / Was ist passiert?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / So lässt es sich nachstellen
      placeholder: |
        1. Open …
        2. Click …
    validations:
      required: false
  - type: input
    id: browser
    attributes:
      label: Browser and device / Browser und Gerät
      placeholder: Chrome 130 on Windows 11, Safari on iPhone 15 …
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: App language / Sprache der App
      options:
        - Deutsch
        - English
        - Other / Andere
    validations:
      required: false
